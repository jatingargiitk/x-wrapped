name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install .
      - run: python -m unittest discover -s tests -v
      - name: Sample archive is reproducible
        run: python examples/make_sample.py && git diff --exit-code examples/
      - run: x-wrapped examples/sample-archive --until 2026-10-31 --tz +05:30 -o card.svg
  png:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[png]"
      - run: python -m unittest discover -s tests -v
      - run: x-wrapped examples/sample-archive --until 2026-10-31 --png card.png && file card.png
